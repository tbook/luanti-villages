name: Lua tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1
      - name: Check Lua syntax
        run: luac5.1 -p init.lua births.lua common.lua navigation.lua farmer.lua planner.lua diagnostic.lua tests/*.lua
      - name: Run standalone tests
        run: |
          for test in tests/*.lua; do
            lua5.1 "$test"
          done
